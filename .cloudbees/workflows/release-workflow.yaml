apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: My workflow
on:
  workflow_dispatch:
    inputs:
      manifest:
        type: string
metadata:
  stages/v1alpha1:
    - name: Stage 1
      jobs:
        - remote
jobs:
  remote:
    env:
      SERVER: server
    with:
      script: |
        echo "Hello world! I'm $(whoami) on $(hostname)"
      labels: my-label-1
    delegates: cloudbees-io/edge-custom-job/custom-job.yaml
